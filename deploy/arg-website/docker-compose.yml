services:
  arg-website:
    image: nginx:1.27-alpine
    container_name: arg-website
    restart: unless-stopped
    ports:
      - "127.0.0.1:4180:80"
    volumes:
      - ../../website:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
